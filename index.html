<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>Toy Shooting</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- スコア・タイム -->
  <div id="hud">

    <div class="hudBox">
      SCORE
      <span id="score">0</span>
    </div>

    <div class="hudBox">
      TIME
      <span id="time">30</span>
    </div>

  </div>


  <!-- ゲームステージ -->
  <main id="stage">

    <!-- ターゲット -->
    <div id="targets"></div>

    <!-- 照準 -->
    <div id="crosshair">
      <div class="crossOuter"></div>
      <div class="crossHorizontal"></div>
      <div class="crossVertical"></div>
      <div class="crossCenter"></div>
    </div>

  </main>


  <!-- ポーズ -->
  <button id="pauseButton">
    PAUSE
  </button>


  <!-- スタート画面 -->
  <div id="startScreen">

    <h1>
      TOY<br>
      SHOOTING
    </h1>

    <p>
      ターゲットをねらって撃とう
    </p>

    <p class="rule">
      30秒間でできるだけ<br>
      高得点を目指そう
    </p>

    <button id="startButton">
      START
    </button>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
